#hsum{font-size:12px;color:var(--mut);margin-top:3px}
#ht{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}#ht th,#ht td{border-bottom:1px solid #e3e3e3;padding:3px 2px;text-align:left;white-space:nowrap}
#ht td.n{text-align:right}#ht tr.hn td{font-weight:700;background:#f3ece8}
.privtag{display:inline-block;background:#b00020;color:#fff;border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px}
.zlabel{background:none;border:0;pointer-events:none}
.badge{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;background:rgba(20,20,20,.45);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.7);border-radius:8px;padding:3px 6px;font-size:11px;line-height:1.25;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.badge b{font-size:13px}
.badge .hv{display:grid;grid-template-columns:repeat(4,auto);gap:0 6px;margin-top:2px}
.badge .hv span{opacity:.55}.badge .hv span.pos{opacity:1;color:#ffd166;font-weight:700}
.pk{width:22px;height:22px;border-radius:50%;border:2px solid #fff;color:#fff;font:bold 12px/18px sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.popup table{border-collapse:collapse;font-size:13px}
.popup td{padding:2px 6px 2px 0}.popup td:last-child{text-align:right;font-weight:600}
.popup h4{margin:0 0 4px;font-size:15px}
#leg .lhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#leg .lhead h3{margin:0}#leg .chev{color:var(--mut);font-size:12px}
#leg.min .more{display:none}
#fsbtn,#themebtn{position:absolute;z-index:1100;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font-size:20px;line-height:40px;text-align:center;padding:0;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#fsbtn{right:10px}#themebtn{right:56px}
html[data-theme="dark"] .leaflet-popup-content-wrapper,html[data-theme="dark"] .leaflet-popup-tip{background:var(--bg);color:var(--fg);box-shadow:0 2px 12px rgba(0,0,0,.55)}
html[data-theme="dark"] .leaflet-popup-content,html[data-theme="dark"] .popup,html[data-theme="dark"] .popup h4,html[data-theme="dark"] .popup td,html[data-theme="dark"] .popup .small{color:var(--fg)}
html[data-theme="dark"] .leaflet-control-zoom a,html[data-theme="dark"] .leaflet-bar a{background:var(--bg);color:var(--fg);border-color:var(--line)}
html[data-theme="dark"] .leaflet-control-zoom a:hover,html[data-theme="dark"] .leaflet-bar a:hover{background:var(--panel-btn)}
html[data-theme="dark"] #ctl select,html[data-theme="dark"] #hq{background:var(--panel-btn);color:var(--fg);border-color:var(--line)}
html[data-theme="dark"] table,html[data-theme="dark"] th,html[data-theme="dark"] td{border-color:var(--tbl);color:var(--fg)}
html[data-theme="dark"] .hvpick button,html[data-theme="dark"] .hvback{background:var(--panel-btn);color:var(--fg);border-color:var(--line)}
body.map-fs #hdr,body.map-fs #toggle,body.map-fs #leg,body.map-fs #ctl{display:none!important}
@media (min-width:641px){#leg .chev{display:none}}
@media (max-width:640px){
 #hdr{right:56px;padding:6px 10px}#hdr h1{font-size:14px}
 #toggle{display:block;position:absolute;z-index:1001;top:70px;left:10px;border:0;border-radius:8px;padding:8px 12px;background:var(--acc);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.4)}
 #ctl{top:112px;width:auto;right:10px;max-width:none;max-height:50%;display:none}
 #ctl.open{display:block}
 #leg{left:10px;right:10px;width:auto;bottom:16px;max-height:34%;overflow:auto}
 .badge{font-size:9.5px;padding:2px 5px}.badge b{font-size:10.5px}
 #leg.min .lrow{display:inline-block;margin-right:6px}#leg.min .lrow .sw{margin-right:2px}
}
</style></head><body>
<div id="map" role="application" aria-label="Deer activity map"></div>
<div id="hdr" class="panel"><h1>MBRB Hunt 14 · Murphy-Hanrehan Park Reserve — Deer Activity</h1>
<div class="sub">Last updated <span id="upd"></span> · data saved <span id="snap"></span></div></div>
<button id="toggle" aria-expanded="false">☰ Layers &amp; filters</button>
<button id="themebtn" type="button" aria-label="Switch to dark mode" title="Dark mode">☾</button>
<button id="fsbtn" type="button" aria-label="Toggle full screen" title="Full screen">⛶</button>
<div id="ctl" class="panel">
 <h3>Hunt day</h3><div class="dayrow"><select id="day" aria-label="Hunt day" autocomplete="off"></select><div class="seg" id="ap" role="group" aria-label="Session time"><button type="button" data-a="all" class="on" aria-pressed="true">All</button><button type="button" data-a="AM" aria-pressed="false">AM</button><button type="button" data-a="PM" aria-pressed="false">PM</button></div><div class="seg" id="hg" role="group" aria-label="Hunt group" hidden></div></div>

 <h3>Zones</h3>
 <div class="zbtn"><button id="zAll" type="button">All</button><button id="zNone" type="button">None</button></div>
 <div id="zones" class="zgrid"></div>
 <h3>Shade zones by</h3>
 <div class="seg" id="metric"><button data-m="rate" class="on">Seen / 100 hrs</button><button data-m="seen">Raw sightings</button></div>
 <h3>Layers</h3>
 <label><input type="checkbox" id="lyChoro" checked> Zone shading</label>
 <label><input type="checkbox" id="lyHeat" checked autocomplete="off"> Heat (smoothed)</label>
 <label><input type="checkbox" id="lyAuto" checked autocomplete="off"> Auto-scale to view</label>
 <label id="lyPinsW" style="display:none"><input type="checkbox" id="lyPins" checked autocomplete="off"> Hunter pins</label>
 <label><input type="checkbox" id="lyHv" checked> Zone labels &amp; harvests</label>
 <label><input type="checkbox" id="lyHvM" checked> Harvests</label>
 <label><input type="checkbox" id="lyPk" checked> Parking</label>
 <h3>Basemap</h3>
 <div class="seg" id="base"><button data-b="sat" class="on">Satellite</button><button data-b="osm">Street (OSM)</button></div>
</div>
<div id="leg" class="panel"></div>
<div id="nozone" class="panel" style="display:none;left:50%;top:45%;transform:translate(-50%,-50%);padding:10px 14px;font-weight:600;cursor:pointer">Select zones to see heat <button type="button">Show all zones</button></div>
